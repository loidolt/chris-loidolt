name = "chris-loidolt-portfolio"
compatibility_date = "2025-04-01" # Required for process.env support with OpenNext
compatibility_flags = ["nodejs_compat"] # Required for Next.js with OpenNext

# OpenNext build output directory
main = ".worker-next/index.mjs"

[observability]
enabled = true

# Environment variables (non-sensitive)
[vars]
NODE_ENV = "production"

# Secrets (set via: wrangler secret put AIRTABLE_API_KEY)
# AIRTABLE_API_KEY
# AIRTABLE_POSTS_BASEID
# AIRTABLE_POSTS_TABLENAME
# AIRTABLE_QUALIFICATIONS_TABLENAME
# AIRTABLE_WEBSITES_TABLENAME
# AIRTABLE_SERVICES_TABLENAME

[env.production]
# Environment variables for production will be set in Cloudflare dashboard
