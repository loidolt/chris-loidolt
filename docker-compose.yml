version: '3.8'

services:
  # PocketBase - Backend CMS
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Persist PocketBase data
      - ./pb_data:/pb/pb_data
      # Optionally mount migrations
      - ./pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - TZ=America/Chicago

  # SvelteKit Development Server
  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sveltekit-dev
    restart: unless-stopped
    ports:
      - "3050:3050"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.svelte-kit
      - /app/build
    environment:
      # PocketBase connection (using Docker service name)
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      # SvelteKit
      - NODE_ENV=development
      - BASE_DOMAIN=${BASE_DOMAIN:-loidolt.space}
      # Contact form (optional)
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_EMAIL_TO=${CONTACT_EMAIL_TO}
      - CONTACT_EMAIL_FROM=${CONTACT_EMAIL_FROM}
      # Vite HMR
      - VITE_HMR_PORT=3050
    depends_on:
      pocketbase:
        condition: service_healthy
    command: npm run dev

networks:
  default:
    name: portfolio-network
